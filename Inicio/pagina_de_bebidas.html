<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Fast Food - Bebidas</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body { background: linear-gradient(180deg, #e63c1a, #f26a1b); min-height: 100vh; padding: 20px; }
  h1 { text-align: center; color: white; font-size: 60px; font-family: Georgia, serif; margin-bottom: 25px; }
  .menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 1000px; margin: 0 auto; }
  .tarjeta { background: #fff8ee; border-radius: 12px; padding: 12px; text-align: center; }
  .tarjeta img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; }
  .tarjeta h2 { margin: 10px 0 5px; }
  .tarjeta p { color: #555; margin-bottom: 10px; }
  .btn { background: #2196F3; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<h1>Fast Food 🥤</h1>
<div class="menu">
  <div class="tarjeta">
    <img src="img/coca.jpg">
    <h2>Coca-Cola Fría</h2><p>$30.00</p>
    <button class="btn" onclick="window.location.href='../Pagina Direccion/pagina2.html'">COMPRAR</button>
  </div>
  <div class="tarjeta">
    <img src="img/horchata.jpg">
    <h2>Agua de Horchata</h2><p>$35.00</p>
    <button class="btn" onclick="window.location.href='../Pagina Direccion/pagina2.html'">COMPRAR</button>
  </div>
  <div class="tarjeta">
    <img src="img/limonada.jpg">
    <h2>Limonada Natural</h2><p>$35.00</p>
    <button class="btn" onclick="window.location.href='../Pagina Direccion/pagina2.html'">COMPRAR</button>
  </div>
  <div class="tarjeta">
    <img src="img/malteada.jpg">
    <h2>Malteada de Fresa</h2><p>$55.00</p>
    <button class="btn" onclick="window.location.href='../Pagina Direccion/pagina2.html'">COMPRAR</button>
  </div>
  <div class="tarjeta">
    <img src="img/cafe.jpg">
    <h2>Café Frappé</h2><p>$50.00</p>
    <button class="btn" onclick="window.location.href='../Pagina Direccion/pagina2.html'">COMPRAR</button>
  </div>
  <div class="tarjeta">
    <img src="img/jugo.jpg">
    <h2>Jugo de Naranja</h2><p>$40.00</p>
    <button class="btn" onclick="window.location.href='../Pagina Direccion/pagina2.html'">COMPRAR</button>
  </div>
</div>
</body>
</html>
