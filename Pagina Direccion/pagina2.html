<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dirección de Entrega</title>
    <link rel="icon" href="../Fast Food.ico" type="Fast Food/x-icon">
    <link rel="shortcut icon" href="../Fast Food.ico" type="Fast Food/x-icon">
    <link rel="stylesheet" href="estilos.css"> <!-- Enlace al archivo CSS externo -->
</head>
<body>
    <header class="img">
    <form action="direccion.php" method="POST"> <!--sentencia sql que guarda datos en el archivo direccion-->
        <h1>FastFood
        <img src="../img/fast%20food3.png" style="margin: -6px; margin-top: -80px">
        </h1>
        <h1>Dirección de Entrega</h1>
        
        <!-- Contenedor principal de la cuadrícula -->
        <div class="form-grid">
            <div class="form-group"> <!--Estilo para cada campo de texto-->
                <label  for="estado">Estado:</label>
                <input type="text" name="estado" required>
            </div>
            <div class="form-group">
                <label for="localidad">Localidad:</label>
                <input type="text" name="Localidad" required>
            </div>
            <div class="form-group">
                <label for="colonia">Colonia:</label>
                <input type="text" name="colonia" required>
            </div>
            <div class="form-group">
                <label for="cp">Código postal:</label>
                <input type="text" name="cp" required>
            </div>
            <div class="form-group">
                <label for="ni">Calle y Número:</label>
                <input type="text" name="Ni" required>
            </div>
            <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input type="text" name="telefono" required>
            </div>
          <div class="form-group textarea-group">
    <label for="indicaciones">Indicaciones o Referencias:</label>
    <textarea name="indicaciones" required></textarea>
</div>
        </div>
        <input type="submit" value="Guardar dirección">
    </form>
    </header>
